<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Indoor position · dev</title>
  <!--
    Development page for the indoor position (indoorloc.js, signloc.js, indoornav.js) on top of the 3D station view
    (station3d.js). Serve the repo (python3 tools/serve.py, or python -m http.server) and open
      indoorloc-dev.html?key=bern
    On a phone (HTTPS needed for sensors): Start sensors, walk, tap "I'm here" now and then (that is the ground truth
    of a recording), Export. Replay a recording or a simulated walk (node tools/sim_indoorloc.cts --export walk.json)
    with Import: the estimate is animated in the 3D view, the true position (if the log has it) as a second dot
    in the panel's error read-out.
  -->
  <style>
    :root { --bg: #ffffff; --ink: #14161a; --muted: #5b6270; --line: #d9dde3; --accent: #1f3a8a; --ok: #1a7f37; --warn: #b35900; --panel: rgba(255,255,255,.96); }
    @media (prefers-color-scheme: dark) { :root { --bg: #111317; --ink: #eef0f3; --muted: #9aa3b0; --line: #2c313a; --accent: #8fb0ff; --ok: #5fd07b; --warn: #ffb35c; --panel: rgba(22,24,29,.96); } }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    #panel { position: fixed; left: 12px; bottom: 12px; z-index: 2147483000; width: min(360px, calc(100vw - 24px)); max-height: 55vh; overflow: auto;
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.18); padding: 10px 12px; }
    #panel.min > :not(header) { display: none; }
    header { display: flex; align-items: center; gap: 8px; }
    header h1 { font-size: 15px; margin: 0; flex: 1; }
    button, select, input { font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
    button { cursor: pointer; } button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; align-items: center; }
    .muted { color: var(--muted); font-size: 12px; }
    .bars { display: grid; grid-template-columns: 34px 1fr 44px; gap: 3px 6px; align-items: center; font-size: 12px; }
    .bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; } .bar i { display: block; height: 100%; background: var(--accent); }
    .chips span { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; margin: 2px 4px 2px 0; font-size: 12px; }
    .on { color: var(--ok); } .off { color: var(--warn); }
    #est { font-weight: 600; }
    input[type=text] { flex: 1; min-width: 0; }
    input[type=range] { flex: 1; }
    #viewer { position: fixed; inset: 0; }
  </style>
</head>
<body>
  <div id="viewer"></div>
  <section id="panel">
    <header><h1>Indoor position</h1><select id="key" aria-label="Station"></select><button id="min" aria-label="Fold panel">–</button></header>
    <div class="row chips" id="sensors"><span>sensors off</span></div>
    <div id="est" aria-live="polite">No position yet</div>
    <div class="muted" id="why"></div>
    <div class="bars" id="bars"></div>
    <div class="row">
      <button class="primary" id="start">Start sensors</button>
      <button id="here" title="Then tap the model where you are">I'm here…</button>
      <select id="floor" aria-label="I'm on this floor"><option value="">I'm on floor…</option></select>
    </div>
    <div class="row"><input type="text" id="sign" placeholder="What a sign says, e.g. Gleis 7 Sektor C" /><button id="read">Read</button></div>
    <div class="muted" id="signout"></div>
    <div class="row">
      <button id="rec">Record</button><button id="export" disabled>Export</button>
      <label class="muted"><input type="file" id="import" accept=".json,application/json" hidden /><span role="button" tabindex="0" id="importBtn" style="border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer">Import &amp; replay</span></label>
    </div>
    <div class="row" id="replayRow" hidden><button id="play">Pause</button><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Replay position" /><span class="muted" id="rt"></span></div>
    <div class="muted" id="err"></div>
    <div class="muted">Barometer: no browser exposes it. Pressure comes only from a native wrapper (Capacitor) or <code>INDOORLOC.pushPressure(hPa)</code>.</div>
  </section>

  <script src="stations3d/index.js"></script>
  <script src="station3d.js"></script>
  <script src="indoorloc.js"></script>
  <script src="signloc.js"></script>
  <script src="indoornav.js"></script>
  <!-- build: src/pages/indoorloc-dev.ts -->
</body>
</html>
