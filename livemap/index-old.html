<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swiss live map</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root { --ink: #16181d; --muted: #646b78; --panel: #ffffffee; --line: #d9dde4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font: 14px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: #e9ecef; }
  #map, #dots { position: absolute; inset: 0; }
  #dots { pointer-events: none; width: 100%; height: 100%; }
  #top { position: absolute; left: 0; right: 0; top: 0; padding: calc(8px + env(safe-area-inset-top)) 8px 0; pointer-events: none; }
  #status { display: inline-block; pointer-events: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; box-shadow: 0 1px 4px #0002; }
  #status b { font-variant-numeric: tabular-nums; }
  #status .sub { color: var(--muted); font-size: 12px; }
  #chips { margin-top: 6px; display: flex; gap: 6px; overflow-x: auto; pointer-events: auto; padding-bottom: 4px; scrollbar-width: none; }
  .chip { flex: none; display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; cursor: pointer; user-select: none; font-variant-numeric: tabular-nums; }
  .chip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .chip.off { opacity: .45; }
  #panel { position: absolute; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); max-width: 440px; margin: 0 auto; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 4px 18px #0003; padding: 12px 14px; display: none; max-height: 46vh; overflow: auto; }
  #panel h2 { margin: 0 0 0 0; padding-right: 138px; font-size: 16px; display: flex; align-items: flex-start; gap: 8px; min-height: 30px; }
  .badge { flex: none; }
  .badge { color: #fff; border-radius: 6px; padding: 1px 7px; font-weight: 700; font-size: 14px; }
  #panel .op { color: var(--muted); font-size: 12px; margin-top: 2px; }
  #panel .state { margin: 8px 0; padding: 6px 8px; border-radius: 8px; background: #f2f4f7; font-size: 13px; }
  #panel .btns { position: absolute; right: 10px; top: 10px; display: flex; gap: 6px; }
  #panel button { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 4px 9px; font: inherit; cursor: pointer; }
  #panel button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  td { padding: 3px 0; vertical-align: top; }
  td.t { width: 52px; color: var(--muted); }
  td.d { width: 56px; text-align: right; }
  .late { color: #c2410c; font-weight: 600; } .ok { color: #15803d; }
  tr.past td { color: #a3a9b4; }
  body.sel .maplibregl-ctrl-bottom-right { display: none; }
  #err { color: #b91c1c; }
</style>
</head>
<body>
<div id="map"></div>
<canvas id="dots"></canvas>
<div id="top">
  <div id="status">Loading vehicles…</div>
  <div id="chips"></div>
</div>
<div id="panel"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<!-- build: page-old.ts -->
</body>
</html>
