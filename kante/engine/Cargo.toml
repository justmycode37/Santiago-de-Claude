[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
kante-core = { path = "crates/core" }
kante-gtfs = { path = "crates/gtfs" }
kante-raptor = { path = "crates/raptor" }
kante-osm = { path = "crates/osm" }
kante-walk = { path = "crates/walk" }
kante-link = { path = "crates/link" }
kante-search = { path = "crates/search" }
kante-rt = { path = "crates/rt" }
anyhow = "1"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
rustc-hash = "2"
memchr = "2"
chrono = "0.4"
chrono-tz = "0.10"
quick-xml = "0.42"
osmpbf = "0.3"
flate2 = "1"
memmap2 = "0.9"
parking_lot = "0.13"
zip = { version = "9", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["fs", "compression-gzip", "compression-br", "cors"] }
ureq = "3"

[profile.release]
opt-level = 3
debug = 1
codegen-units = 16
lto = "thin"

[profile.dev]
opt-level = 1
