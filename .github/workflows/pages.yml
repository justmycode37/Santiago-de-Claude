# Build the site and publish it to GitHub Pages on every push to main.
#
# Needs one setting, made once by a repository admin:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# The engine (kante/) and the live map (livemap/) need their own server and are not part of this.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits for the running one instead of cancelling it half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # src/ → the page's bundle (main.js, chunks/) and its other scripts, plus the files served as they are (scripts/build.mts)
      - name: Build the site
        run: node scripts/build.mts --release

      - name: Record the commit this was built from
        run: |
          printf 'window.BUILD = { commit: "%s", committed: "%s", repo: "%s" };\n' \
            "$GITHUB_SHA" "$(git log -1 --format=%cI)" "$GITHUB_REPOSITORY" > dist/version.js
          cat dist/version.js

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
