<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Scan benchmark</title>
  <style>
    :root { --bg: #fcfcfc; --text: #1c1c1e; --muted: #6e6e73; --card: #fff; --hair: rgba(60,60,67,.14); --accent: #344D77; --ok: #2f7d4f; --bad: #A8456B; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1c1f24; --text: #fff; --muted: #98989f; --card: #2c2c2e; --hair: rgba(255,255,255,.12); --accent: #9DB4DD; --ok: #6fcf97; --bad: #E28CAD; color-scheme: dark; } }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px 16px calc(env(safe-area-inset-bottom) + 24px); background: var(--bg); color: var(--text);
           font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 24px; margin: 0 0 4px; }
    p { margin: 0 0 14px; color: var(--muted); }
    button { width: 100%; height: 48px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: 600 16px/1 inherit; cursor: pointer; }
    button:disabled { opacity: .5; }
    img { display: block; width: 100%; max-height: 220px; object-fit: cover; border-radius: 12px; margin: 14px 0; background: var(--hair); }
    dl { margin: 14px 0 0; padding: 4px 14px; border-radius: 12px; background: var(--card); box-shadow: 0 0 0 1px var(--hair); }
    dl div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--hair); }
    dl div:first-child { border-top: 0; }
    dt { color: var(--muted); }
    dd { margin: 0; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
    .ok { color: var(--ok); } .bad { color: var(--bad); }
    #log { margin-top: 12px; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; color: var(--muted); white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1>Scan benchmark</h1>
    <p>Times the two engines Scan uses on this device: the sign reader (OCR) and the photo fingerprint model, on a real
      Swiss stop sign. It also checks that the screen keeps drawing smoothly meanwhile. The first run downloads about 30 MB.</p>
    <button id="go" type="button">Run benchmark</button>
    <img id="img" alt="Bus stop sign Gams, Simmirank (Wikimedia Commons)" crossorigin="anonymous"
         src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/58/Bushaltestelle_Gams_Simmirank.jpg/960px-Bushaltestelle_Gams_Simmirank.jpg" />
    <dl id="out"></dl>
    <div id="log" role="status"></div>
  </main>
  <script src="stop-images/index.js"></script>
  <script src="stopvision.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const row = (k, v, cls) => { const d = document.createElement('div'); const dt = document.createElement('dt'); const dd = document.createElement('dd');
      dt.textContent = k; dd.textContent = v; if (cls) dd.className = cls; d.append(dt, dd); $('out').append(d); };
    const log = (t) => { $('log').textContent += t + '\n'; };
    // device facts that decide the speed
    row('Cores', navigator.hardwareConcurrency || '?');
    row('Memory (approx.)', navigator.deviceMemory ? navigator.deviceMemory + ' GB' : '?');
    row('WASM threads', self.crossOriginIsolated ? 'yes' : 'no (static hosting: single thread)');
    row('WebGPU', 'gpu' in navigator ? 'available' : 'no');

    $('go').addEventListener('click', async () => {
      $('go').disabled = true;
      // count frames the page could not draw in time while the engines work
      let last = 0, long = 0, frames = 0, worst = 0, on = true;
      const tick = (t) => { if (last) { const d = t - last; frames++; if (d > 50) long++; worst = Math.max(worst, d); } last = t; if (on) requestAnimationFrame(tick); };
      requestAnimationFrame(tick);
      try {
        const img = $('img');
        if (!img.complete || !img.naturalWidth) await new Promise((r, j) => { img.onload = r; img.onerror = () => j(new Error('sample image did not load')); });
        const r = await STOPVISION.bench($('img'), 8, (t) => log(t));
        on = false;
        row('Sign reader load', r.ocrLoadMs + ' ms');
        row('Image model load', r.modelLoadMs + ' ms (' + r.engine + ')');
        row('Photo fingerprint', `${r.photoMs.p50} ms (p95 ${r.photoMs.p95})`, r.photoMs.p50 < 1200 ? 'ok' : 'bad');
        row('Sign reading', `${r.ocrMs.p50} ms (p95 ${r.ocrMs.p95})`, r.ocrMs.p50 < 2500 ? 'ok' : 'bad');
        row('Frames late (> 50 ms)', `${long} of ${frames}, worst ${Math.round(worst)} ms`, long / Math.max(frames, 1) < 0.1 ? 'ok' : 'bad');
        row('Text read', r.text || '(none)');
        const realtime = r.photoMs.p50 < 1200 && r.ocrMs.p50 < 2500 && long / Math.max(frames, 1) < 0.1;
        row('Verdict', realtime ? 'Fast enough for live scanning' : 'Slow: Scan will update less often', realtime ? 'ok' : 'bad');
      } catch (err) {
        on = false;
        log('Failed: ' + (err && err.message || err));
      }
      $('go').disabled = false;
    });
  </script>
</body>
</html>
