<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Detail scene · development page</title>
  <!--
    Shows a detail scene (stations3d/<key>.detail.js, drawn by station3d-detail.js) on its own, without the viewer.

    URL parameters
      scene=bern | _fixture          which scene. Default: bern, and _fixture if that file is missing
      theme=light | dark             day or night. Default: the system setting
      quality=high | low
      season=winter | summer         bare or leafy trees, overriding the data. Default: what the data says
      pollard=1 | 0                  draw all broadleaf trees pollarded (knuckles and shoots) or none. Default: the data
      view=pov | orbit               walk at eye height (default) or look at the whole scene from above
      at=<m>                         metres along the path
      yaw=<deg> pitch=<deg>          head turned right / up from the direction of the path
      eye=<m>                        eye height (1.6)        fov=<deg> (76, as in the viewer)
      orbit=<az>,<el>,<dist>         overview: compass bearing the camera looks to, degrees above the horizon, metres
      cam=<x>,<y>,<z>&look=<x>,<y>,<z>   a free camera in model coordinates (z above the ground at that point if
                                     written as +1.2), for close-ups
      sun=<azimuth>,<elevation>      where the light comes from
      zshift=<m> | auto              move the whole scene up or down (auto: by the zOffset of the data)
      flatten=1                      take the slope of the street out (the ground lies level, as in the viewer)
      shadows=0                      no cast shadows on the ground
      feather=<m> featherinside=<m> feathercolor=<hex without #>   the rim of the ground (see the renderer's header)
      route=0                        hide the blue route band        fog=0   no haze
      ui=0                           hide the controls (for screenshots)
      tram=1                         a tram on the scene's track beside the end of the walk (line=<digits>, default 9).
                                     The Tram button or the keys T (it arrives), O (doors), G (it leaves) move it;
                                     for scripts: DEV.tram = { vehicle, path, stop, arrive(seconds), depart(seconds), doors(open) }
    For scripts: window.__ready is a promise that resolves with the stats once the first frame is drawn;
    DEV.set({ at, yaw, … }) changes the view, DEV.rebuild({ theme, quality, season }) the look.
  -->
  <!-- build: src/pages/station3d-detail-dev.theme.ts -->
  <style>
    :root { --paper: #F3EFE7; --ink: #2B2A27; --soft: #7A7364; --line: rgba(43,42,39,.16); --route: #007AFF; --panel: rgba(247,244,238,.86); color-scheme: light; }
    :root[data-theme="dark"] { --paper: #1B1D22; --ink: #ECE9E2; --soft: #9A9DA6; --line: rgba(255,255,255,.16); --route: #0A84FF; --panel: rgba(30,32,36,.84); color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink); overscroll-behavior: none;
      font-family: Bahnschrift, "DIN Alternate", "Avenir Next Condensed", "Helvetica Neue", Arial, sans-serif; font-variant-numeric: tabular-nums; }
    canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; cursor: grab; }
    canvas#gl:active { cursor: grabbing; }
    .head { position: fixed; left: 16px; right: 16px; top: calc(env(safe-area-inset-top) + 14px); pointer-events: none; }
    .head h1 { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: .01em; line-height: 1.1; }
    .head p { margin: 3px 0 0; font-size: 12.5px; color: var(--soft); max-width: 34ch; line-height: 1.35; }
    .head h1, .head p { text-shadow: 0 0 6px var(--paper), 0 0 2px var(--paper); }
    .dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(env(safe-area-inset-bottom) + 14px); background: var(--panel);
      -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3); border-top: 1px solid var(--line); }
    .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .where { font-size: 26px; font-weight: 600; line-height: 1; white-space: nowrap; }
    .where small { font-size: 13px; font-weight: 400; color: var(--soft); margin-left: 6px; }
    .opts { display: flex; gap: 12px; white-space: nowrap; }
    .opts button { border: 0; background: none; padding: 6px 0; font: inherit; font-size: 13px; color: var(--soft); cursor: pointer; border-bottom: 2px solid transparent; }
    .opts button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--route); }
    .opts button:focus-visible, .tape input:focus-visible { outline: 2px solid var(--route); outline-offset: 3px; border-radius: 2px; }
    /* the scrubber is a measuring tape laid along the walk: a tick every metre, a longer one every five */
    .tape { position: relative; height: 40px; margin-top: 8px; }
    .tape .ticks { position: absolute; left: 0; right: 0; top: 0; height: 18px; border-bottom: 1.5px solid var(--ink);
      background-image: linear-gradient(to right, var(--ink) 1.5px, transparent 1.5px), linear-gradient(to right, var(--soft) 1px, transparent 1px);
      background-repeat: repeat-x; background-position: left bottom; }
    .tape .nums { position: absolute; left: 0; right: 0; top: 21px; height: 14px; font-size: 11px; color: var(--soft); }
    .tape .nums span { position: absolute; transform: translateX(-50%); }
    .tape .nums span:first-child { transform: none; } .tape .nums span:last-child { transform: translateX(-100%); }
    .tape input { position: absolute; left: -10px; width: calc(100% + 20px); top: -6px; height: 34px; margin: 0; background: none; -webkit-appearance: none; appearance: none; cursor: ew-resize; }
    .tape input::-webkit-slider-runnable-track { height: 34px; background: none; }
    .tape input::-moz-range-track { height: 34px; background: none; }
    .tape input::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 30px; margin-top: 2px; border: 0; border-radius: 0;
      background: linear-gradient(var(--route), var(--route)) center / 3px 100% no-repeat, radial-gradient(circle at 50% 5px, var(--route) 5px, transparent 5.5px); }
    .tape input::-moz-range-thumb { width: 20px; height: 30px; border: 0; border-radius: 0;
      background: linear-gradient(var(--route), var(--route)) center / 3px 100% no-repeat, radial-gradient(circle at 50% 5px, var(--route) 5px, transparent 5.5px); }
    .tape[hidden], .head[hidden], .dock[hidden] { display: none; }
    .fail { position: fixed; inset: 0; display: grid; place-content: center; padding: 32px; text-align: left; max-width: 40ch; margin: auto; line-height: 1.4; }
  </style>
</head>
<body>
  <canvas id="gl" tabindex="0" role="application" aria-label="The street scene. Drag to look around; arrow keys: up and down walk along the path, left and right turn."></canvas>
  <header class="head" id="head"><h1 id="name">Loading the street</h1><p id="stat"></p></header>
  <div class="dock" id="dock">
    <div class="row">
      <div class="where"><span id="at">0.0</span><small id="of">m</small></div>
      <div class="opts">
        <button type="button" id="bView" aria-pressed="false">Overview</button>
        <button type="button" id="bNight" aria-pressed="false">Night</button>
        <button type="button" id="bLeaves" aria-pressed="false">Leaves</button>
        <button type="button" id="bLow" aria-pressed="false">Coarse</button>
        <button type="button" id="bTram" hidden>Tram</button>
      </div>
    </div>
    <div class="tape" id="tape"><div class="ticks" id="ticks"></div><div class="nums" id="nums"></div>
      <input type="range" id="scrub" min="0" max="1" step="0.01" value="0" aria-label="Position along the walk in metres" /></div>
  </div>

  <!-- build: src/pages/station3d-detail-dev.ts -->
</body>
</html>
